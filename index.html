<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VinJack MS - Sales & Inventory Management System</title>
    <!-- Modern Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Design System Stylesheet -->
    <link rel="stylesheet" href="public/css/styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation (Hidden on Login) -->
        <aside id="sidebar" class="sidebar hidden">
            <div class="sidebar-header">
                <div class="flex items-center gap-2">
                    <div class="brand-crest">
                        <span style="font-size: 1.25rem;">🏍️</span>
                    </div>
                    <span class="brand-name">VinJack MS</span>
                </div>
                <button id="sidebar-toggle" class="sidebar-collapse-btn" title="Toggle Sidebar">&lsaquo;</button>
            </div>

            <nav class="sidebar-nav overflow-x-auto whitespace-nowrap scrollbar-none">
                <!-- Top Dashboard Link -->
                <a href="#/dashboard" class="nav-link" id="nav-dashboard">
                    <i class="nav-icon">📊</i> <span class="nav-text">Dashboard</span>
                </a>

                <!-- SALES SECTION -->
                <div class="sidebar-section-title">SALES</div>
                <a href="#/pos" class="nav-link" id="nav-pos">
                    <i class="nav-icon">🛒</i> <span class="nav-text">Sales (POS)</span>
                </a>
                <a href="#/customers" class="nav-link" id="nav-customers">
                    <i class="nav-icon">👥</i> <span class="nav-text">Customers</span>
                </a>

                <!-- INVENTORY & SUPPLY SECTION -->
                <div class="sidebar-section-title">INVENTORY & SUPPLY</div>
                <a href="#/products" class="nav-link" id="nav-products">
                    <i class="nav-icon">📦</i> <span class="nav-text">Inventory</span>
                </a>
                <a href="#/purchase-orders" class="nav-link" id="nav-purchase-orders">
                    <i class="nav-icon">📋</i> <span class="nav-text">Purchase Orders</span>
                </a>
                <a href="#/suppliers" class="nav-link" id="nav-suppliers">
                    <i class="nav-icon">🏢</i> <span class="nav-text">Suppliers</span>
                </a>

                <!-- REPORTS SECTION -->
                <div class="sidebar-section-title">REPORTS</div>
                <a href="#/reports" class="nav-link" id="nav-reports">
                    <i class="nav-icon">📊</i> <span class="nav-text">Reports</span>
                </a>
                <a href="#/audit-log" class="nav-link" id="nav-audit-log">
                    <i class="nav-icon">📑</i> <span class="nav-text">Audit Log</span>
                </a>

                <!-- ADMIN SECTION -->
                <div class="sidebar-section-title">ADMIN</div>
                <a href="#/users" class="nav-link" id="nav-user-mgmt">
                    <i class="nav-icon">👤</i> <span class="nav-text">User Management</span>
                </a>
            </nav>
        </aside>

        <!-- Main Wrapper (Topbar + View Outlet) -->
        <div class="main-wrapper">
            <!-- Topbar (Solid Royal Blue matching screenshot) -->
            <header id="app-topbar" class="topbar hidden">
                <div class="topbar-left">
                    <span class="topbar-title" id="current-page-title">Dashboard</span>
                </div>
                <div class="topbar-actions">
                    <!-- Profile Avatar & Role Dropdown Menu -->
                    <div class="profile-dropdown-wrapper" id="profile-dropdown-wrapper">
                        <button type="button" class="profile-avatar-btn" id="profile-dropdown-toggle" title="User Account Menu" aria-haspopup="true" aria-expanded="false">
                            <div class="user-avatar-circle">
                                <span>👤</span>
                            </div>
                            <div class="user-meta hidden md:block">
                                <div class="name" id="user-display-name">Super Admin</div>
                                <div class="role" id="user-display-role">Super Admin</div>
                            </div>
                            <span style="font-size: 0.7rem; opacity: 0.85;">▾</span>
                        </button>

                        <div class="profile-dropdown-menu hidden" id="profile-dropdown-menu">
                            <div class="p-3 border-b">
                                <div class="font-bold text-sm" id="dropdown-user-name">Super Admin</div>
                                <div class="text-xs text-muted" id="dropdown-user-username">@admin</div>
                                <div class="mt-1">
                                    <span class="badge badge-primary text-xs" id="dropdown-user-role">Super Admin</span>
                                </div>
                            </div>
                            <div class="p-1">
                                <button type="button" class="dropdown-item flex items-center gap-2 w-full p-2 text-danger text-sm rounded cursor-pointer" id="dropdown-logout-btn">
                                    <span>🚪</span> <span>Sign Out / Logout</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </header>

            <!-- Global Flash Alert Banner -->
            <div id="alert-banner-container" class="hidden"></div>

            <!-- Dynamic View Outlet -->
            <main id="app-root" class="app-outlet">
                <!-- Page component will be rendered here by router.js -->
            </main>
        </div>
    </div>

    <!-- Application Bootstrap (ES6 Modules) -->
    <script type="module">
        import { router } from './public/js/router.js';
        document.addEventListener('DOMContentLoaded', () => {
            router.init();
        });
    </script>
</body>
</html>
