<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VinJack MS - Sales & Inventory Management System</title>
    <!-- Modern Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Design System Stylesheet -->
    <link rel="stylesheet" href="public/css/styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation (Hidden on Login) -->
        <aside id="app-sidebar" class="sidebar hidden">
            <div class="sidebar-header">
                <div class="flex items-center gap-2">
                    <div class="brand-crest">
                        <span style="font-size: 1.25rem;">🏍️</span>
                    </div>
                    <span class="brand-name">VinJack MS</span>
                </div>
                <button id="sidebar-toggle-btn" class="sidebar-collapse-btn" title="Toggle Sidebar">&lsaquo;</button>
            </div>

            <nav class="sidebar-nav overflow-x-auto whitespace-nowrap scrollbar-none">
                <!-- Top Dashboard Link -->
                <a href="#/dashboard" class="nav-link" id="nav-dashboard">
                    <i class="nav-icon">📊</i> <span>Dashboard</span>
                </a>

                <!-- SALES SECTION -->
                <div class="sidebar-section-title">SALES</div>
                <a href="#/pos" class="nav-link" id="nav-pos">
                    <i class="nav-icon">🛒</i> <span>Sales (POS)</span>
                </a>
                <a href="#/customers" class="nav-link" id="nav-customers">
                    <i class="nav-icon">👥</i> <span>Customers</span>
                </a>
                <a href="#/returns" class="nav-link" id="nav-returns">
                    <i class="nav-icon">↩️</i> <span>Returns</span>
                </a>

                <!-- INVENTORY & SUPPLY SECTION -->
                <div class="sidebar-section-title">INVENTORY & SUPPLY</div>
                <a href="#/products" class="nav-link" id="nav-products">
                    <i class="nav-icon">📦</i> <span>Inventory</span>
                </a>
                <a href="#/movements" class="nav-link" id="nav-deliveries">
                    <i class="nav-icon">🚚</i> <span>Deliveries</span>
                </a>
                <a href="#/purchase-orders" class="nav-link" id="nav-purchase-orders">
                    <i class="nav-icon">📋</i> <span>Purchase Orders</span>
                </a>
                <a href="#/suppliers" class="nav-link" id="nav-suppliers">
                    <i class="nav-icon">🏢</i> <span>Suppliers</span>
                </a>
                <a href="#/returns" class="nav-link" id="nav-supplier-returns">
                    <i class="nav-icon">🚛</i> <span>Supplier Returns</span>
                </a>
                <a href="#/consignment" class="nav-link" id="nav-consignment">
                    <i class="nav-icon">🤝</i> <span>Consignment Payouts</span>
                </a>

                <!-- REPORTS SECTION -->
                <div class="sidebar-section-title">REPORTS</div>
                <a href="#/reports" class="nav-link" id="nav-reports">
                    <i class="nav-icon">📊</i> <span>Reports</span>
                </a>
                <a href="#/pos" class="nav-link" id="nav-transactions">
                    <i class="nav-icon">📄</i> <span>Transactions</span>
                </a>
                <a href="#/movements" class="nav-link" id="nav-audit-log">
                    <i class="nav-icon">📑</i> <span>Audit Log</span>
                </a>

                <!-- ADMIN SECTION -->
                <div class="sidebar-section-title">ADMIN</div>
                <a href="#/users" class="nav-link" id="nav-user-mgmt">
                    <i class="nav-icon">👤</i> <span>User Management</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <button id="logout-btn" class="btn btn-secondary btn-block btn-sm flex items-center justify-center gap-2">
                    <span>🚪</span> <span>Logout</span>
                </button>
            </div>
        </aside>

        <!-- Main Wrapper (Topbar + View Outlet) -->
        <div class="main-wrapper">
            <!-- Topbar (Solid Royal Blue matching screenshot) -->
            <header id="app-topbar" class="topbar hidden">
                <div class="topbar-left">
                    <span class="topbar-title" id="current-page-title">Dashboard</span>
                </div>
                <div class="topbar-actions">
                    <button class="topbar-icon-btn" title="Notifications" id="notif-btn">
                        <span>🔔</span>
                        <span class="notif-badge-dot"></span>
                    </button>
                    <div class="user-avatar-circle" title="User Profile">
                        <span>👤</span>
                    </div>
                </div>
            </header>

            <!-- Global Flash Alert Banner -->
            <div id="alert-banner-container" class="hidden"></div>

            <!-- Dynamic View Outlet -->
            <main id="app-root" class="app-outlet">
                <!-- Page component will be rendered here by router.js -->
            </main>
        </div>
    </div>

    <!-- Application Bootstrap (ES6 Modules) -->
    <script type="module">
        import { router } from './public/js/router.js';
        document.addEventListener('DOMContentLoaded', () => {
            router.init();
        });
    </script>
</body>
</html>
