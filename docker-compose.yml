version: '3.8'

services:
  vinjack-db:
    image: mysql:8.0
    container_name: vinjack-db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: vinjack_db
    volumes:
      - ./database/vinjack_schema.sql:/docker-entrypoint-initdb.d/1-schema.sql:ro
      - ./database/vinjack_seed.sql:/docker-entrypoint-initdb.d/2-seed.sql:ro
      - vinjack_db_data:/var/lib/mysql
    networks:
      - vinjack-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 10

  vinjack-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vinjack-app
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      DB_HOST: vinjack-db
      DB_PORT: 3306
      DB_NAME: vinjack_db
      DB_USER: root
      DB_PASSWORD: rootpass
      MYSQL_SSL_VERIFY: "false"
    depends_on:
      vinjack-db:
        condition: service_healthy
    networks:
      - vinjack-network

volumes:
  vinjack_db_data:

networks:
  vinjack-network:
    driver: bridge
